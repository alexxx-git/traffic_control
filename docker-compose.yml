services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    ports: 
      - 9092:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:29092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  influxdb3:
    image: influxdb:3-core
    container_name: influxdb3
    ports:
      - 8181:8181
    command:
      - influxdb3
      - serve
      - --node-id=node0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
    volumes:
      - ./src/traffic_control/services/influxdb3:/var/lib/influxdb3/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f -H \"Authorization: Bearer ${TC_INFLUXDB_ADMIN_TOKEN}\" http://localhost:8181/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  telegraf:
    image: telegraf:1.40-alpine
    container_name: telegraf
    depends_on:
      kafka:
        condition: service_healthy
      influxdb3:
        condition: service_healthy
    volumes:
      - ./src/traffic_control/services/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pgrep telegraf || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - 3000:3000
    depends_on:
      influxdb3:
        condition: service_healthy
    volumes:
      - ./src/traffic_control/services/grafana:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${TC_GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${TC_GRAFANA_ADMIN_PASSWORD}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - 8090:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

